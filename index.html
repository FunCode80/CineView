<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>CineView | Ontdek de beste films</title>

    <!-- Meta Tags voor WhatsApp, LinkedIn & Google -->
    <meta name="title" content="CineView | Ontdek de beste films" />
    <meta name="description" content="Vind populaire en trending films op CineView. Je eigen filmdatabase aangedreven door TMDB." />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cine-view-dusky.vercel.app" />
    <meta property="og:title" content="CineView - Jouw Film Database" />
    <meta property="og:description" content="Ontdek, zoek en bewaar je favoriete films op CineView. Gebouwd met React & Vite." />
    <!-- Let op: WhatsApp houdt van absolute links naar je logo -->
    <meta property="og:image" content="https://cine-view-dusky.vercel.app/logo.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://cine-view-dusky.vercel.app" />
    <meta property="twitter:title" content="CineView - Jouw Film Database" />
    <meta property="twitter:description" content="Ontdek, zoek en bewaar je favoriete films op CineView." />
    <meta property="twitter:image" content="https://cine-view-dusky.vercel.app/logo.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
